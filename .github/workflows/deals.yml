name: DealHunter Affiliate Bot Autonomous Pipeline

on:
  schedule:
    - cron: '0 */4 * * *' # Cada 4 horas
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  hunt-deals:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Ejecutar Cazador de Ofertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AFFILIATE_TAG: 'tito-deals-20'
        run: node index.js

      - name: 4. Auto-Commit de Base Histórica
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ofertas_publicadas.json
          git diff --staged --quiet || (git commit -m "chore(data): actualizar historial de ofertas publicadas [skip ci]" && git push)
